<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enter code</title>
    <style>
         :root {
            --bg: #0f0f0f;
            --text: #f4f4f4;
            --text-soft: #d6d6d6;
            --brand: #a34fde;
            /* purple accent for dark background */
            --brand-deep: #8a1f9c;
            --input-border: #6f6f6f;
            --btn-disabled: #4b4f4b;
            --radius-input: 18px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* ---------- Top bar ---------- */
        
        .topbar {
            display: grid;
            grid-template-columns: 44px 1fr 44px;
            align-items: center;
            padding: 18px 20px;
        }
        
        .topbar .title {
            text-align: center;
            font-size: 20px;
            font-weight: 700;
        }
        
        .icon-btn {
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        
        .icon-btn:hover {
            background: rgba(255, 255, 255, .08);
        }
        /* ---------- Content ---------- */
        
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            padding: 24px 24px 32px;
        }
        
        .message {
            text-align: center;
            font-size: 19px;
            line-height: 1.5;
            color: var(--text);
            margin: 24px 0 36px;
        }
        
        .message .email {
            font-weight: 600;
            word-break: break-all;
        }
        
        .code-form {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        
        .code-input {
            width: 100%;
            background: transparent;
            border: 1px solid var(--input-border);
            border-radius: var(--radius-input);
            padding: 20px 18px;
            font-size: 17px;
            color: var(--text);
            outline: none;
            transition: border-color .15s;
        }
        
        .code-input::placeholder {
            color: #9a9a9a;
        }
        
        .code-input:focus {
            border-color: var(--text);
        }
        
        .resend {
            background: none;
            border: none;
            color: var(--brand);
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            margin: 48px auto 14px;
            padding: 6px 10px;
        }
        
        .resend:hover:not(:disabled) {
            text-decoration: underline;
        }
        
        .resend:disabled {
            color: #7a7a7a;
            cursor: not-allowed;
        }
        
        .expiry {
            text-align: center;
            font-size: 16px;
            color: var(--text-soft);
        }
        /* ---------- Bottom action ---------- */
        
        .actions {
            margin-top: auto;
            padding-top: 40px;
        }
        
        .btn-verify {
            display: block;
            width: 100%;
            padding: 17px;
            font-size: 17px;
            font-weight: 700;
            color: #e8e8e8;
            background: var(--btn-disabled);
            border: none;
            border-radius: 10px;
            cursor: not-allowed;
            transition: background .15s;
        }
        
        .btn-verify.enabled {
            background: var(--brand-deep);
            color: #fff;
            cursor: pointer;
        }
        
        .btn-verify.enabled:hover {
            background: #a02cb5;
        }
        /* ---------- Responsive ---------- */
        
        @media (max-width: 480px) {
            .topbar {
                padding: 14px 12px;
            }
            .main {
                padding: 16px 20px 24px;
            }
            .message {
                font-size: 18px;
                margin: 16px 0 28px;
            }
            .resend {
                margin-top: 36px;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">
        <button class="icon-btn" id="backBtn" aria-label="Go back">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"/>
      <polyline points="12 19 5 12 12 5"/>
    </svg>
  </button>

        <div class="title">Enter code</div>

        <button class="icon-btn" aria-label="Help">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
      <line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
  </button>
    </header>

    <main class="main">
        <p class="message">
            We have sent a verification code to
            <span class="email" id="userEmail">your registered email</span>. If you do not see our email in your inbox, check your spam folder
        </p>

        <form class="code-form" id="codeForm" novalidate>
            <input class="code-input" id="codeInput" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="Verification code" maxlength="6" aria-label="Verification code" />

            <button type="button" class="resend" id="resendBtn">Send new code</button>
            <p class="expiry" id="expiryText">Your code will be active for 15:00.</p>

            <div class="actions">
                <button type="submit" class="btn-verify" id="verifyBtn" disabled>Verify</button>
            </div>
        </form>
    </main>

    <script>
        // ---------- Read the email saved by the login page ----------
        const userEmail = document.getElementById('userEmail');
        const savedEmail = localStorage.getItem('loginEmail');

        if (savedEmail) {
            userEmail.textContent = savedEmail;
        } else {
            // Direct visit without going through the login page
            userEmail.textContent = 'your registered email';
            userEmail.style.fontWeight = '400';
        }

        // ---------- Elements ----------
        const codeInput = document.getElementById('codeInput');
        const verifyBtn = document.getElementById('verifyBtn');
        const codeForm = document.getElementById('codeForm');
        const resendBtn = document.getElementById('resendBtn');
        const expiryText = document.getElementById('expiryText');
        const backBtn = document.getElementById('backBtn');

        // ---------- Code validation: enable Verify only with a plausible code ----------
        function validateCode() {
            const ok = codeInput.value.trim().length >= 4;
            verifyBtn.disabled = !ok;
            verifyBtn.classList.toggle('enabled', ok);
            return ok;
        }

        codeInput.addEventListener('input', () => {
            // Demo: accept digits only
            codeInput.value = codeInput.value.replace(/\D/g, '');
            validateCode();
        });

        // ---------- 15-minute code lifetime countdown ----------
        const TOTAL_SECONDS = 15 * 60;
        let secondsLeft = TOTAL_SECONDS;
        let countdownId = null;

        function renderCountdown() {
            const m = Math.floor(secondsLeft / 60);
            const s = String(secondsLeft % 60).padStart(2, '0');
            if (secondsLeft > 0) {
                expiryText.textContent = 'Your code will be active for ' + m + ':' + s + '.';
            } else {
                expiryText.textContent = 'Your code has expired. Please send a new one.';
                verifyBtn.disabled = true;
                verifyBtn.classList.remove('enabled');
            }
        }

        function startCountdown() {
            clearInterval(countdownId);
            secondsLeft = TOTAL_SECONDS;
            renderCountdown();
            countdownId = setInterval(() => {
                secondsLeft--;
                renderCountdown();
            }, 1000);
        }

        startCountdown();

        // ---------- Resend (visual cooldown only - no network in this static demo) ----------
        const RESEND_COOLDOWN = 30;
        let cooldownLeft = 0;
        let cooldownId = null;

        resendBtn.addEventListener('click', () => {
            if (cooldownLeft > 0) return;
            startCountdown();
            cooldownLeft = RESEND_COOLDOWN;
            resendBtn.disabled = true;
            cooldownId = setInterval(() => {
                cooldownLeft--;
                if (cooldownLeft > 0) {
                    resendBtn.textContent = 'Resend available in ' + cooldownLeft + 's';
                } else {
                    clearInterval(cooldownId);
                    resendBtn.textContent = 'Send new code';
                    resendBtn.disabled = false;
                }
            }, 1000);
        });

        // ---------- Demo submit: inert, nothing is stored or transmitted ----------
        codeForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (!validateCode() || secondsLeft <= 0) return;
            alert('Demo only: this static page does not verify or store any code.');
        });

        // ---------- Back navigation ----------
        backBtn.addEventListener('click', () => {
            if (history.length > 1) {
                history.back();
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>

</body>

</html>
